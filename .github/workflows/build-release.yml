name: Build Windows installer and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Generate build version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          "VERSION = `"$version`"" | Set-Content -Encoding UTF8 src\_build_version.py
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build application and installer
        shell: pwsh
        run: .\build.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aspiradora-Xiaomi-Setup-${{ env.APP_VERSION }}
          path: |
            installer_output/Aspiradora-Xiaomi-Setup.exe
            installer_output/Aspiradora-Xiaomi-Setup.exe.sha256

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          $repo = $env:GITHUB_REPOSITORY
          $notes = "V59 para Windows 10/11 x64. Integra una competencia total de métodos para obtener el mapa real del Xiaomi E10/B112. Prueba en paralelo propiedades MIoT 7/30 map_url, 7/33 current_map, 10/2 cur-map-id y 10/4 map-list por LAN y Cloud datasource 1/2; get-map-list 10/1 y uploads por cada map-id válido mediante 10/14 y 10/2; realtime 10/18, 10/15(0), 10/6(0) por LAN/Cloud; eventos 10.2/10.4/10.6 y clean-end 7.1; device log; slot clásico; compatibilidad MiIO get_map_v1/v2, get_map, get_fresh_map/v2, get_persist_map/v2, get_multi_map, get_recover_maps y clean-record; construcción de referencias FDS incluyendo user_id/did/map; resolvers getmapfileurl/getfileurl/interim/_pro; y decoders imagen/B112/IJAI/Xiaomi JSON. El primer mapa válido gana, se cachea y F12 muestra una tabla OK/FAIL/TIMEOUT con el método GANADOR."

          gh release create $tag `
            --title "Aspiradora Xiaomi $env:APP_VERSION · V59" `
            --notes $notes `
            --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear la release $tag" }

          function Upload-AssetWithRetry([string]$file, [string]$name) {
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              Write-Host "Subiendo $name · intento $attempt/6"
              $args = @("release", "upload", $tag, $file, "--clobber", "--repo", $repo)
              $process = Start-Process -FilePath "gh" -ArgumentList $args -PassThru -NoNewWindow
              $finished = $process.WaitForExit(90000)
              if (-not $finished) {
                Write-Warning "Upload de $name excedió 90 s; reiniciando intento."
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              } elseif ($process.ExitCode -eq 0) {
                Start-Sleep -Seconds 3
                $json = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
                $asset = @($json.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1)
                if ($asset.Count -gt 0 -and $asset[0].state -eq "uploaded") {
                  Write-Host "$name confirmado como uploaded."
                  return
                }
                Write-Warning "$name todavía no figura como uploaded."
              } else {
                Write-Warning "gh terminó con código $($process.ExitCode) para $name."
              }
              Start-Sleep -Seconds (5 * $attempt)
            }
            throw "No se pudo subir y confirmar $name después de 6 intentos."
          }

          Upload-AssetWithRetry "installer_output/Aspiradora-Xiaomi-Setup.exe.sha256" "Aspiradora-Xiaomi-Setup.exe.sha256"
          Upload-AssetWithRetry "installer_output/Aspiradora-Xiaomi-Setup.exe" "Aspiradora-Xiaomi-Setup.exe"

          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          $exe = @($release.assets | Where-Object { $_.name -eq "Aspiradora-Xiaomi-Setup.exe" } | Select-Object -First 1)
          $sha = @($release.assets | Where-Object { $_.name -eq "Aspiradora-Xiaomi-Setup.exe.sha256" } | Select-Object -First 1)
          if ($exe.Count -eq 0 -or $exe[0].state -ne "uploaded") { throw "EXE no confirmado en la release." }
          if ($sha.Count -eq 0 -or $sha[0].state -ne "uploaded") { throw "SHA no confirmado en la release." }
          Write-Host "Release $tag publicada y verificada con ambos assets."
