name: Build Windows installer and release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Generate build version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          "VERSION = `"$version`"" | Set-Content -Encoding UTF8 src\_build_version.py
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build application and installer
        shell: pwsh
        run: .\build.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aspiradora-Xiaomi-Setup-${{ env.APP_VERSION }}
          path: |
            installer_output/Aspiradora-Xiaomi-Setup.exe
            installer_output/Aspiradora-Xiaomi-Setup.exe.sha256

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          $repo = $env:GITHUB_REPOSITORY
          $notes = "V73 para Windows 10/11 x64. Corrige la contaminación de fases observada en V71/V72: el track acumulado 10/24 se consume de forma incremental y cada punto se asigna una sola vez a la fase vigente; el regreso a base se registra como tránsito y ya no puede reaparecer como Interior. El inicio de cada Paso reinicia el track vivo para evitar arrastrar IDs y puntos de la fase anterior. La distancia de retorno ahora parsea también el 10/24 crudo tipo x_y_ángulo, eliminando el None visto en diagnóstico. Paso 2 incorpora detección de giro sin avance y repetición prolongada de un sector, con una maniobra limitada de retroceso/giro y reanudación; el watchdog de fin se pausa durante esa maniobra para no producir falsos finales. La proximidad al origen ya no autoriza Paso 2: se exige carga real status=4 o subida de batería. Además, los retornos vigilados detectan acople sin carga en la rampa, retroceden y reintentan hasta dos veces y, si no logran contacto, detienen las ruedas para proteger la batería. Conserva íntegro el viewport V72: leyenda fija, zoom, Zoom Extents y centrado en base. El pipeline mantiene smoke tests estrictos hasta V73."

          gh release create $tag `
            --title "Aspiradora Xiaomi $env:APP_VERSION · V73" `
            --notes $notes `
            --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear la release $tag" }

          function Upload-AssetWithRetry([string]$file, [string]$name) {
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              Write-Host "Subiendo $name · intento $attempt/6"
              $args = @("release", "upload", $tag, $file, "--clobber", "--repo", $repo)
              $process = Start-Process -FilePath "gh" -ArgumentList $args -PassThru -NoNewWindow
              $finished = $process.WaitForExit(90000)
              if (-not $finished) {
                Write-Warning "Upload de $name excedió 90 s; reiniciando intento."
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              } elseif ($process.ExitCode -eq 0) {
                Start-Sleep -Seconds 3
                $json = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
                $asset = @($json.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1)
                if ($asset.Count -gt 0 -and $asset[0].state -eq "uploaded") {
                  Write-Host "$name confirmado como uploaded."
                  return
                }
                Write-Warning "$name todavía no figura como uploaded."
              } else {
                Write-Warning "gh terminó con código $($process.ExitCode) para $name."
              }
              Start-Sleep -Seconds (5 * $attempt)
            }
            throw "No se pudo subir y confirmar $name después de 6 intentos."
          }

          Upload-AssetWithRetry "installer_output/Aspiradora-Xiaomi-Setup.exe.sha256" "Aspiradora-Xiaomi-Setup.exe.sha256"
          Upload-AssetWithRetry "installer_output/Aspiradora-Xiaomi-Setup.exe" "Aspiradora-Xiaomi-Setup.exe"

          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          $exe = @($release.assets | Where-Object { $_.name -eq "Aspiradora-Xiaomi-Setup.exe" } | Select-Object -First 1)
          $sha = @($release.assets | Where-Object { $_.name -eq "Aspiradora-Xiaomi-Setup.exe.sha256" } | Select-Object -First 1)
          if ($exe.Count -eq 0 -or $exe[0].state -ne "uploaded") { throw "EXE no confirmado en la release." }
          if ($sha.Count -eq 0 -or $sha[0].state -ne "uploaded") { throw "SHA no confirmado en la release." }
          Write-Host "Release $tag publicada y verificada con ambos assets."
