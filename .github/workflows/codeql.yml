name: CodeQL security scan

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze-python:
    name: CodeQL · Python
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
